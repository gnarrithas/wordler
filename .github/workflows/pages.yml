name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily redeploy publishing the next day's word (scripts/shuffle_solutions.py
  # writes days up to tomorrow, UTC). UTC+14 reaches tomorrow at 10:00 UTC, so
  # the second run is a retry well inside that window. Schedules run from the
  # default branch, and GitHub disables them after 60 days without commits in
  # a public repo.
  schedule:
    - cron: "7 0 * * *"
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: python3 -m unittest discover -s scripts
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Today's and tomorrow's words, never later ones; fails the deploy if
      # the secret is missing.
      - run: python3 scripts/shuffle_solutions.py public/words/solutions.txt build/words/daily.txt
        env:
          SOLUTIONS_SHUFFLE_SEED: ${{ secrets.SOLUTIONS_SHUFFLE_SEED }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
